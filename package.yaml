name: Telos
version: 0.1.0.0
github: "pe200012/Telos"
license: BSD-3-Clause
author: "pe200012"
maintainer: "1326263755@qq.com"
copyright: "2026 pe200012"

extra-source-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/pe200012/Telos#readme>

language: GHC2021

dependencies:
  - base >= 4.7 && < 5
  - aeson
  - ansi-terminal
  - attoparsec
  - bytestring
  - conduit
  - conduit-extra
  - containers
  - crypton
  - directory
  - filepath
  - haskeline
  - http-conduit
  - http-client
  - lens
  - lens-aeson
  - memory
  - optparse-applicative
  - polysemy
  - process
  - relude
  - text
  - time
  - tomland

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

default-extensions:
  - BangPatterns
  - DerivingStrategies
  - DataKinds
  - FlexibleContexts
  - FlexibleInstances
  - LambdaCase
  - MultiParamTypeClasses
  - MultiWayIf
  - NoImplicitPrelude
  - OverloadedStrings
  - RankNTypes
  - ScopedTypeVariables
  - TupleSections
  - ViewPatterns

library:
  source-dirs: src

executables:
  Telos-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - Telos

tests:
  Telos-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - Telos
      - directory
      - filepath
      - hspec
      - temporary
