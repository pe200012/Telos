name: Telos
version: 0.1.0.0
github: "pe200012/Telos"
license: BSD-3-Clause
author: "pe200012"
maintainer: "1326263755@qq.com"
copyright: "2026 pe200012"

extra-source-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/pe200012/Telos#readme>

dependencies:
  - base >= 4.7 && < 5
  - relude
  - safe
  # Text and ByteString
  - text
  - bytestring
  # JSON
  - aeson >= 2.0
  # Containers
  - containers
  - unordered-containers
  - vector
  # Effects
  - polysemy >= 1.9
  # Streaming
  - conduit >= 1.3
  - conduit-extra
  # HTTP
  - http-client >= 0.7
  - http-client-tls
  - http-types
  - http-conduit
  # Process management
  - process >= 1.6
  # Concurrency
  - async >= 2.2
  - stm >= 2.5
  - unliftio
  # Time
  - time
  # File system
  - filepath
  - directory
  - Glob
  # Regex
  - regex-tdfa
  # Typed process
  - typed-process
  # Diff
  - Diff
  # Transformers
  - mtl
  - transformers
  - exceptions
  # Unix (for signal handling)
  - unix
  # Lenses
  - microlens
  - microlens-th
  - microlens-pro
  - microlens-aeson
  # UUID generation
  - uuid
  - random
  # Cryptographic hashing
  - cryptohash-sha256
  - base16-bytestring

default-extensions:
  - BangPatterns
  - ConstraintKinds
  - DataKinds
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - DerivingStrategies
  - FlexibleContexts
  - FlexibleInstances
  - GADTs
  - GeneralizedNewtypeDeriving
  - LambdaCase
  - MultiParamTypeClasses
  - OverloadedStrings
  - PolyKinds
  - RankNTypes
  - ScopedTypeVariables
  - StandaloneDeriving
  - TemplateHaskell
  - TypeApplications
  - TypeFamilies
  - TypeOperators
  - NoImplicitPrelude

ghc-options:
  - -Wall
  - -Werror
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
executables:
  Telos-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - Telos

  test-copilot:
    main: TestCopilot.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -main-is
      - TestCopilot
    dependencies:
      - Telos

  test-agent:
    main: TestAgent.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -main-is
      - TestAgent
    dependencies:
      - Telos

tests:
  Telos-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - Telos
      - hspec >= 2.10
      - hspec-discover
      - QuickCheck
      - quickcheck-instances
      - aeson
      - temporary
